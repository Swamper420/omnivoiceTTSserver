server:
  host: "0.0.0.0"
  port: 8000
  workers: 1

model:
  # Quantized GGUF backend (omnivoice.cpp). Switch size with one knob:
  # F32 | BF16 | Q8_0 | Q4_K_M  (default Q4_K_M = smallest, ~407MB + ~252MB)
  repo_id: "Serveurperso/OmniVoice-GGUF"
  quant: "Q4_K_M"
  # Optional explicit overrides (default derived from quant above):
  # base_file: "omnivoice-base-Q4_K_M.gguf"
  # tokenizer_file: "omnivoice-tokenizer-Q4_K_M.gguf"
  models_dir: "models"
  binary: "omnivoice-tts" # omnivoice.cpp binary on PATH or absolute path
  device: "cuda" # display only; runtime picks backend via GGML_BACKEND (CUDA0/Vulkan0/Metal/CPU)

storage:
  voices_dir: "storage/voices"
  prompt_cache_dir: "storage/cache"

default_gen_config:
  language: "en"
  speed: 1.0
  num_step: 32
  guidance_scale: 2.0
  response_format: "wav" # wav, mp3, ogg, flac
